name: Deploy GUI to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.1
        with:
          version: "latest"

      # trunk downloads wasm-bindgen from GitHub releases on every build, and
      # a 504 there failed a deploy. Keep the download between runs; the key
      # changes when Cargo.lock (and so the wasm-bindgen version) does.
      - name: Cache trunk tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ hashFiles('Cargo.lock') }}
          restore-keys: trunk-tools-

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build web GUI
        run: trunk build --release --public-url "${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
